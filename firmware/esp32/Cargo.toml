[package]
name = "esp32-mixer"
version = "0.1.0"
edition = "2021"

[dependencies]
mixer-core = { path = "../mixer-core" }
esp-hal = { version = "=0.23.1", features = ["esp32", "unstable"] }
esp-wifi = { version = "=0.12.0", features = ["esp32", "wifi", "utils"] }
esp-alloc = "=0.6.0"
esp-backtrace = { version = "=0.15.1", features = ["esp32", "exception-handler", "println"] }
esp-println = { version = "=0.13.1", features = ["esp32"] }
smoltcp = { version = "=0.12.0", default-features = false, features = ["medium-ethernet", "proto-ipv4", "socket-dhcpv4", "socket-tcp", "socket-dns"] }
nb = "1.1"

critical-section = "1.2"
esp32 = "=0.35.0"
fugit = "0.3.9"
