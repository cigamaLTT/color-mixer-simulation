[build]
target = "xtensa-esp32-espidf"

[target.xtensa-esp32-espidf]
linker = "ldproxy"
rustflags = ["--cfg", "espidf_time64"]

[unstable]
build-std = ["std", "panic_abort"]

[resolver]
incompatible-rust-versions = "fallback"

[env]
MCU = "esp32"
ESP_IDF_VERSION = "v5.3.3"
ESP_IDF_TOOLS_INSTALL_DIR = "workspace"
ESP_IDF_COMPONENT_MANAGER = "off"
